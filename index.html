    let state = (() => {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          parsed.members.forEach(m => {
            if (!parsed.fees[m.id]) parsed.fees[m.id] = {};
            if (!parsed.fees[m.id][REAL_PERIOD_KEY]) {
              parsed.fees[m.id][REAL_PERIOD_KEY] = {
                paid: false,
                paidDate: '',
                amount: m.monthlyFee,
                method: '',
                paidBy: '',
                portalRef: ''
              };
            }
          });
          if (!parsed.incomingReports) parsed.incomingReports = [];
          return parsed;
        }
        return buildDefaultState();
      } catch (e) {
        return buildDefaultState();
      }
    })();

    let currentUserId = localStorage.getItem(USER_SESSION_KEY) || '';
    let toastMessage = '';

    function saveState() {
      const now = new Date();
      state.lastSyncTime = now.toLocaleDateString('vi-VN') + ' ' + now.toTimeString().slice(0, 5);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      render();
    }

    function showToast(msg) {
      toastMessage = msg;
      render();
      setTimeout(() => {
        toastMessage = '';
        render();
      }, 4200);
    }

    function formatVND(num) {
      return Number(num || 0).toLocaleString('vi-VN') + ' đ';
    }

    function calc3DaysBefore(dateVN) {
      try {
        const [d, m, y] = dateVN.split('/').map(Number);
        const dt = new Date(y, m - 1, d);
        dt.setDate(dt.getDate() - 3);
        return dt.toLocaleDateString('vi-VN');
      } catch (e) {
        return 'Trước 03 ngày';
      }
    }

    function getCurrentTimestampStr() {
      const n = new Date();
      const dd = String(n.getDate()).padStart(2, '0');
      const mm = String(n.getMonth() + 1).padStart(2, '0');
      const yyyy = n.getFullYear();
      const hh = String(n.getHours()).padStart(2, '0');
      const min = String(n.getMinutes()).padStart(2, '0');
      const ss = String(n.getSeconds()).padStart(2, '0');
      return `${dd}/${mm}/${yyyy} lúc ${hh}:${min}:${ss}`;
    }

    function getMemberFeeRecord(memberId, periodKey = REAL_PERIOD_KEY) {
      const m = state.members.find(x => x.id === memberId);
      if (!state.fees[memberId]) state.fees[memberId] = {};
      if (!state.fees[memberId][periodKey]) {
        state.fees[memberId][periodKey] = {
          paid: false,
          paidDate: '',
          amount: m ? m.monthlyFee : 80000,
          method: '',
          paidBy: '',
          portalRef: ''
        };
      }
      return state.fees[memberId][periodKey];
    }

    function submitSelfPartyFee(targetMemberId, isProxy = false) {
      const payer = state.members.find(m => m.id === currentUserId);
      const target = state.members.find(m => m.id === targetMemberId);
      if (!target) return;

      const defaultAmt = target.monthlyFee || 80000;
      const inputAmt = prompt(
        `Xác nhận báo nộp Đảng phí tháng ${REAL_PERIOD_KEY} cho Đ/c ${target.fullName}:\nNhập số tiền thực nộp (VNĐ):`,
        String(defaultAmt)
      );
      if (inputAmt === null) return;
      const cleanAmt = parseInt(inputAmt.replace(/[^0-9]/g, ''), 10) || defaultAmt;

      const todayStr = `${String(REAL_DAY).padStart(2, '0')}/${REAL_MONTH_STR}/${REAL_YEAR}`;
      const rec = getMemberFeeRecord(targetMemberId, REAL_PERIOD_KEY);
      rec.paid = true;
      rec.paidDate = todayStr;
      rec.amount = cleanAmt;
      rec.method = isProxy ? 'Đóng hộ qua Cổng TTHC Đảng' : 'Đảng viên báo nộp qua Cổng TTHC Đảng';
      rec.paidBy = payer.fullName;
      rec.portalRef = 'DVC-CD26-' + Math.floor(100000 + Math.random() * 900000);

      target.monthlyFee = cleanAmt;
      target.handbookSynced = true;
      saveState();
      showToast(`Đã xác nhận Đ/c ${target.fullName} nộp ${formatVND(cleanAmt)} Đảng phí tháng ${REAL_PERIOD_KEY}!`);
    }

    function toggleFeeStatusAdmin(targetMemberId) {
      const target = state.members.find(m => m.id === targetMemberId);
      const rec = getMemberFeeRecord(targetMemberId, REAL_PERIOD_KEY);
      if (rec.paid) {
        if (!confirm(`Chuyển trạng thái của Đ/c ${target.fullName} về Chưa nộp?`)) return;
        rec.paid = false;
        rec.paidDate = '';
        rec.portalRef = '';
        saveState();
        showToast(`Đã chuyển trạng thái của Đ/c ${target.fullName} về Chưa nộp`);
      } else {
        submitSelfPartyFee(targetMemberId, target.id !== currentUserId);
      }
    }

    function handleAiFileUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      state.aiUploadedFileName = file.name;
      if (file.type.startsWith('image/')) {
        const reader = new FileReader();
        reader.onload = function(ev) {
          state.aiUploadedImagePreview = ev.target.result;
          if (!state.aiRawNotes.trim()) {
            state.aiRawNotes = `[Đã tải lên ảnh chụp biên bản/tài liệu gốc: ${file.name}]\n- Nội dung trích xuất gợi ý: Cuộc họp Chi bộ 26 thống nhất đánh giá kết quả thực hiện nhiệm vụ tháng qua, biểu quyết thông qua các chỉ tiêu trọng tâm tháng tới với 100% Đảng viên có mặt tán thành.`;
          }
          render();
          showToast('Đã tiếp nhận ảnh chụp biên bản gốc!');
        };
        reader.readAsDataURL(file);
      } else {
        const reader = new FileReader();
        reader.onload = function(ev) {
          const text = ev.target.result;
          if (text && typeof text === 'string' && !text.includes('\u0000')) {
            state.aiRawNotes = text.slice(0, 6000);
          } else {
            state.aiRawNotes = `[Đã tiếp nhận tệp Word/tài liệu gốc: ${file.name}]\n- Dữ liệu gốc đã sẵn sàng để biên soạn chuẩn thể thức văn bản Đảng.`;
          }
          state.aiUploadedImagePreview = '';
          render();
          showToast('Đã tải tệp tài liệu gốc lên hệ thống!');
        };
        reader.readAsText(file);
      }
    }

        BC_HOAT_DONG_25: `ĐẢNG ỦY ĐẶC KHU CÔN ĐẢO                    ĐẢNG CỘNG SẢN VIỆT NAM\nCHI BỘ 26                                 Đặc khu Côn Đảo, ngày 25 tháng ${mm} năm ${yyyy}\nSố: ………-BC/CB\n\n                                    BÁO CÁO\n        Tình hình hoạt động của Chi bộ 26 tháng ${mm} năm ${yyyy}\n        (Phục vụ kỳ họp sinh hoạt Chi bộ định kỳ ngày mùng 03 tháng sau)\n\nKính gửi: Ban Thường vụ Đảng ủy Đặc khu Côn Đảo.\n\nThực hiện quy chế làm việc của Chi bộ 26, Chi ủy báo cáo tình hình hoạt động tháng ${mm}/${yyyy} để trình hội nghị Chi bộ định kỳ ngày mùng 03 tháng sau như sau:\n\nI. ĐẶC ĐIỂM TÌNH HÌNH ĐẢNG VIÊN\n- Tổng số Đảng viên của Chi bộ: ${totalMembers} đồng chí (Chính thức: ${officialCount} đồng chí; Dự bị: ${reserveCount} đồng chí - Đ/c Nguyễn Tiến Văn Phái).\n- Cấp ủy Chi bộ gồm 03 đồng chí: Bí thư Nguyễn Anh Tuấn; Phó Bí thư Đoàn Thị Diệu Hiền; Chi ủy viên Phan Kiều Diễm.\n\nII. KẾT QUẢ LÃNH ĐẠO THỰC HIỆN NHIỆM VỤ THÁNG ${mm}/${yyyy}\n1. Công tác chính trị, tư tưởng: Toàn thể Đảng viên chấp hành nghiêm Cương lĩnh, Điều lệ Đảng, Nghị quyết của Đảng ủy Đặc khu Côn Đảo; giữ vững đoàn kết nội bộ tại Khu dân cư số 3.\n2. Công tác thu, nộp Đảng phí: Tính đến ngày 25/${mm}/${yyyy}, đã có ${paidList.length}/${totalMembers} đồng chí hoàn thành nộp Đảng phí qua Cổng TTHC Đảng với tổng số tiền ${formatVND(totalCollected)}.\n3. Công tác chuẩn hóa dữ liệu Đảng viên: Đã làm sạch ${cleanDone}/44 đồng chí (${((cleanDone/44)*100).toFixed(2)}%); đang làm sạch ${cleanDoing}/44 đồng chí; chưa làm sạch ${cleanNot}/44 đồng chí.${extraSection}\n\nIII. PHƯƠNG HƯỚNG, NHIỆM VỤ TRỌNG TÂM THÁNG SAU\n1. Tổ chức tốt buổi sinh hoạt Chi bộ định kỳ vào đúng ngày mùng 03 tháng sau.\n2. Tiếp tục đôn đốc hoàn thành 100% chỉ tiêu thu Đảng phí và làm sạch dữ liệu Đảng viên trên Sổ tay Đảng viên điện tử.\n\nNơi nhận:                                            T/M CHI BỘ 26\n- Đảng ủy Đặc khu Côn Đảo (để b/c);                       BÍ THƯ\n- Toàn thể Đảng viên Chi bộ 26;\n- L         BIEN_BAN_HOP_04: `ĐẢNG ỦY ĐẶC KHU CÔN ĐẢO                    ĐẢNG CỘNG SẢN VIỆT NAM\nCHI BỘ 26                                 Đặc khu Côn Đảo, ngày 04 tháng ${mm} năm ${yyyy}\nSố: ………-BB/CB\n\n                            BIÊN BẢN HỌP CHI BỘ\n            Sinh hoạt Chi bộ định kỳ tháng ${mm} năm ${yyyy}\n\nI. THỜI GIAN, ĐỊA ĐIỂM, THÀNH PHẦN THAM DỰ\n1. Thời gian: Vào lúc 19 giờ 00 phút, ngày 03 tháng ${mm} năm ${yyyy}.\n2. Địa điểm: Nhà văn hóa Khu dân cư số 3, Đặc khu Côn Đảo.\n3. Thành phần:\n- Chủ tọa: Đồng chí Nguyễn Anh Tuấn – Bí thư Chi bộ 26.\n- Thư ký: Đồng chí Phan Kiều Diễm – Chi ủy viên.\n- Tổng số Đảng viên triệu tập: ${totalMembers} đồng chí (Chính thức: ${officialCount}; Dự bị: ${reserveCount}).\n- Có mặt: ……… đồng chí; Vắng có phép: ……… đồng chí; Vắng không phép: 0 đồng chí.\n\nII. NỘI DUNG CUỘC HỌP\n1. Đồng chí Bí thư Chi bộ tuyên bố lý do, thông qua chương trình sinh hoạt định kỳ tháng ${mm}/${yyyy} và thông tin tình hình thời sự, văn bản chỉ đạo mới của Đảng ủy Đặc khu Côn Đảo.\n2. Đồng chí Phó Bí thư Đoàn Thị Diệu Hiền trình bày dự thảo Báo cáo tình hình hoạt động của Chi bộ tháng trước và phương hướng nhiệm vụ tháng ${mm}/${yyyy}.\n3. Thảo luận của Đảng viên:${extraSection || '\n- Các đồng chí Đảng viên thống nhất cao với dự thảo báo cáo; tập trung thảo luận giải pháp giữ gìn an ninh trật tự, vệ sinh môi trường tại KDC số 3 và hoàn thiện làm sạch dữ liệu Đảng viên.'}\n\nIII. BIỂU QUYẾT THÔNG QUA NGHỊ QUYẾT\n- Số Đảng viên tán thành: ………/${totalMembers} đồng chí (đạt 100% số có mặt).\n- Số không tán thành: 0 đồng chí.\nCuộc họp kết thúc vào lúc 20 giờ 30 phút cùng ngày./.\n\n        THƯ KÝ                                        CHỦ TỌA\n   (Ký, ghi rõ họ tên)                            (Ký, ghi rõ họ tên)\n\n    Phan Kiều Diễm                                 Nguyễn Anh Tuấn`,

        CHAM_DIEM_SHCB: `ĐẢNG ỦY ĐẶC KHU CÔN ĐẢO                    ĐẢNG CỘNG SẢN VIỆT NAM\nCHI BỘ 26                                 Đặc khu Côn Đảo, ngày 04 tháng ${mm} năm ${yyyy}\n\n                BẢNG TỰ CHẤM ĐIỂM CHẤT LƯỢNG SINH HOẠT CHI BỘ\n                    Kỳ sinh hoạt định kỳ tháng ${mm} năm ${yyyy}\n            (Ban hành kèm theo Hướng dẫn của Ban Tổ chức Trung ương)\n\n| STT | Tiêu chí đánh giá chất lượng sinh hoạt Chi bộ | Điểm tối đa | Chi bộ tự chấm |\n|-----|-----------------------------------------------|-------------|----------------|\n|  1  | Công tác chuẩn bị sinh hoạt (Họp Chi ủy, gửi tài liệu trước 3 ngày) | 15 điểm | 15 điểm |\n|  2  | Tổ chức sinh hoạt đúng ngày mùng 03, tỷ lệ Đảng viên tham dự cao | 15 điểm | 14 điểm |\n|  3  | Nội dung sinh hoạt toàn diện (Chính trị tư tưởng, thực hiện nhiệm vụ) | 25 điểm | 24 điểm |\n|  4  | Thực hiện nguyên tắc tập trung dân chủ, tự phê bình và phê bình | 20 điểm | 19 điểm |\n|  5  | Chất lượng thảo luận, đóng góp ý kiến của Đảng viên tại cuộc họp | 15 điểm | 14 điểm |\n|  6  | Ban hành Nghị quyết, phân công nhiệm vụ và ghi chép Biên bản đầy đủ | 10 điểm | 10 điểm |\n|     | TỔNG CỘNG ĐIỂM ĐẠT ĐƯỢC (Xếp loại: TỐT) | 100 điểm | 96 điểm |\n\nGhi chú bổ sung từ thực tế kỳ họp:${extraSection || '\n- Chi bộ duy trì nghiêm túc việc gửi dự thảo báo cáo trước 3 ngày và điểm danh điện tử.'}\n\n                                                     T/M CHI BỘ 26\n                                                        BÍ THƯ\n                                                   Nguyễn Anh Tuấn`,

        KET_LUAN_BI_THU: `ĐẢNG ỦY ĐẶC KHU CÔN ĐẢO                    ĐẢNG CỘNG SẢN VIỆT NAM\nCHI BỘ 26                                 Đặc khu Côn Đảo, ngày 04 tháng ${mm} năm ${yyyy}\nSố: ………-TB/CB\n\n                                THÔNG BÁO\n        Kết luận của đồng chí Bí thư Chi bộ tại kỳ sinh hoạt tháng ${mm}/${yyyy}\n\nTại kỳ sinh hoạt Chi bộ định kỳ ngày 03/${mm}/${yyyy}, sau khi nghe báo cáo tình hình hoạt động và ý kiến thảo luận của các đồng chí Đảng viên, đồng chí Nguyễn Anh Tuấn – Bí thư Chi bộ 26 kết luận và giao nhiệm vụ như sau:\n\n1. Về công tác chính trị, tư tưởng và tuyên truyền:\n- Giao đồng chí Đoàn Thị Diệu Hiền – Phó Bí thư Chi bộ tiếp tục đăng tải kịp thời các văn bản chỉ đạo của Đảng ủy Đặc khu Côn Đảo lên Bản tin Chi bộ để 44 Đảng viên nghiên cứu, thực hiện.\n\n2. Về công tác quản lý Đảng viên và thu nộp Đảng phí:\n- Giao đồng chí Phan Kiều Diễm – Chi ủy viên theo dõi, đôn đốc ${totalMembers - paidList.length} đồng chí còn lại hoàn thành nộp Đảng phí tháng ${mm}/${yyyy} qua Cổng TTHC Đảng trước ngày 18/${mm}/${yyyy}.\n- Các Tổ trưởng Tổ Đảng 1, 2, 3, 4 trực tiếp hỗ trợ ${cleanNot} đồng chí chưa làm sạch dữ liệu hoàn thành cập nhật hồ sơ.${extraSection}\n\n3. Tổ chức thực hiện:\n- Toàn thể 44 đồng chí Đảng viên nghiêm túc triển khai thực hiện và báo cáo kết quả tại kỳ sinh hoạt tiếp theo./.\n\nNơi nhận:                                            T/M CHI BỘ 26\n- Toàn thể Đảng viên Chi bộ 26;                          BÍ THƯ\n- Lưu Chi bộ.                                      Nguyễn Anh Tuấn`,

        NGHI_QUYET_DINH_KY: `ĐẢNG ỦY ĐẶC KHU CÔN ĐẢO                    ĐẢNG CỘNG SẢN VIỆT NAM\nCHI BỘ 26                                 Đặc khu Côn Đảo, ngày 04 tháng ${mm} năm ${yyyy}\nSố: ………-NQ/CB\n\n                                NGHỊ QUYẾT\n            Lãnh đạo thực hiện nhiệm vụ chính trị tháng ${mm} năm ${yyyy}\n\nCăn cứ Điều lệ Đảng Cộng sản Việt Nam;\nCăn cứ Nghị quyết, Chương trình công tác năm ${yyyy} của Đảng ủy Đặc khu Côn Đảo;\nCăn cứ kết quả hội nghị sinh hoạt Chi bộ 26 ngày 03 tháng ${mm} năm ${yyyy},\n\n                        CHI BỘ 26 QUYẾT NGHỊ:\n\nI. Tán thành đánh giá tình hình thực hiện nhiệm vụ tháng trước và phương hướng nhiệm vụ tháng ${mm}/${yyyy} do Chi ủy trình bày tại hội nghị.\nII. Tập trung lãnh đạo thực hiện các chỉ tiêu, nhiệm vụ trọng tâm tháng ${mm}/${yyyy}:\n1. 100% Đảng viên giữ vững phẩm chất chính trị, gương mẫu chấp hành quy định tại nơi cư trú (Khu dân cư số 3).\n2. Phấn đấu 100% Đảng viên hoàn thành nghĩa vụ đóng Đảng phí tháng ${mm}/${yyyy} đúng hạn và cập nhật đầy đủ trên Sổ tay Đảng viên điện tử.\n3. Hoàn thành công tác rà soát, làm sạch dữ liệu Đảng viên theo tiến độ Đảng ủy Đặc khu giao.${extraSection}\n\nIII. Giao Chi ủy Chi bộ 26 tổ chức triển khai, kiểm tra, đôn đốc toàn thể Đảng viên thực hiện thắng lợi Nghị quyết này.\nNghị quyết đã được Chi bộ 26 biểu quyết thông qua ngày 03/${mm}/${yyyy} với tỷ lệ 100% Đảng viên có mặt tán thành./.\n\nNơi nhận:                                            T/M CHI BỘ 26\n- Đảng ủy Đặc khu Côn Đảo (để b/c);                       BÍ THƯ\n- Toàn thể Đảng viên Chi bộ 26;\n- Lưu Chi bộ.                                        Nguyễn Anh Tuấn`,

        NGHI_QUYET_CHUYEN_DE: `ĐẢNG ỦY ĐẶC KHU CÔN ĐẢO                    ĐẢNG CỘNG SẢN VIỆT NAM\nCHI BỘ 26                                 Đặc khu Côn Đảo, ngày 04 tháng ${mm} năm ${yyyy}\nSố: ………-NQ/CB\n\n                        NGHỊ QUYẾT SINH HOẠT CHUYÊN ĐỀ\n        Về nâng cao chất lượng sinh hoạt Chi bộ và chuyển đổi số công tác Đảng\n                        tháng ${mm} năm ${yyyy}\n\nCăn cứ Hướng dẫn của Trung ương và Đảng ủy Đặc khu Côn Đảo về nâng cao chất lượng sinh hoạt chuyên đề;\nQua thảo luận tại buổi sinh hoạt chuyên đề của Chi bộ 26 tháng ${mm}/${yyyy},\n\n                        CHI BỘ 26 QUYẾT NGHỊ:\n\n1. Xác định việc ứng dụng công nghệ số trong quản lý sinh hoạt Chi bộ, điểm danh điện tử, gửi tài liệu nghiên cứu trước 03 ngày và nộp Đảng phí trực tuyến là nhiệm vụ trọng tâm nhằm nâng cao năng lực lãnh đạo của Chi bộ 26.\n2. Yêu cầu mỗi đồng chí Đảng viên chủ động khai thác thông tin trên Bản tin Chi bộ, tích cực tham gia phát biểu xây dựng Nghị quyết.${extraSection}\n3. Giao Chi ủy Chi bộ theo dõi, đánh giá kết quả thực hiện chuyên đề gắn với xếp loại chất lượng Đảng viên cuối năm./.\n\nNơi nhận:                                            T/M CHI BỘ 26\n- Đảng ủy Đặc khu Côn Đảo (để b/c);                       BÍ THƯ\n- Toàn thể Đảng viên Chi bộ 26;\n- Lưu Chi bộ.                                        Nguyễn Anh Tuấn`
      };

      return templates[tpl] || templates.BC_HOAT_DONG_25;

    function runAiDocumentSynthesis() {
      const user = state.members.find(m => m.id === currentUserId);
      if (!user || user.role !== 'ADMIN') {
        return alert('Chỉ tài khoản Admin (Chi ủy) mới có quyền soạn báo cáo!');
      }
      const tpl = document.getElementById('tpl-selector').value;
      const mm = document.getElementById('rpt-month').value;
      const yyyy = document.getElementById('rpt-year').value;
      const raw = document.getElementById('ai-raw-input').value.trim();

      state.selectedDocTemplate = tpl;
      state.reportTargetMonth = mm;
      state.reportTargetYear = yyyy;
      state.aiRawNotes = raw;
      state.printMode = 'AI_DOC';
      state.aiGeneratedOutput = buildTemplateText(tpl, mm, yyyy, raw);
      saveState();
      showToast('Đã lập báo cáo chuẩn thể thức văn bản Đảng!');
    }

    function downloadTemplateForm(tplKey) {
      const mm = state.reportTargetMonth || REAL_MONTH_STR;
      const yyyy = state.reportTargetYear || String(REAL_YEAR);
      const content = buildTemplateText(tplKey, mm, yyyy, '');
      const htmlDoc = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>BieuMau_ChiBo26</title></head><body style="font-family: 'Times New Roman', serif; font-size: 14pt; line-height: 1.5;"><pre style="font-family: 'Times New Roman', serif; white-space: pre-wrap;">${content}</pre></body></html>`;
      const blob = new Blob(['\ufeff', htmlDoc], { type: 'application/msword' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `BieuMau_ChiBo26_${tplKey}_Thang${mm}_${yyyy}.doc`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('Đã tải biểu mẫu chuẩn về máy!');
    }

    function downloadGeneratedWordDoc() {
      const content = state.aiGeneratedOutput;
      if (!content) return alert('Vui lòng bấm "Lập báo cáo" trước!');
      const htmlDoc = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>VanBan_ChiBo26</title></head><body style="font-family: 'Times New Roman', serif; font-size: 14pt; line-height: 1.5;"><pre style="font-family: 'Times New Roman', serif; white-space: pre-wrap;">${content}</pre></body></html>`;
      const blob = new Blob(['\ufeff', htmlDoc], { type: 'application/msword' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `ChiBo26_${state.selectedDocTemplate}_Thang${state.reportTargetMonth}_${state.reportTargetYear}.doc`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('Đã tải tệp Word (.doc) về máy!');
    }

    function submitMemberReport() {
      const titleInput = document.getElementById('member-report-title');
      const fileInput = document.getElementById('member-report-file');
      const user = state.members.find(m => m.id === currentUserId);
      if (!user) return;

      const title = titleInput ? titleInput.value.trim() : `Báo cáo kiểm điểm cá nhân năm ${REAL_YEAR}`;
      const fileName = fileInput && fileInput.files[0] ? fileInput.files[0].name : 'BaoCao_KiemDiem_CaNhan.doc';

      const pushReport = (dataUrl) => {
        state.incomingReports.unshift({
          id: 'REP-' + Date.now(),
          memberId: user.id,
          memberName: user.fullName,
          title,
          submittedAt: new Date().toLocaleDateString('vi-VN') + ' ' + new Date().toTimeString().slice(0, 5),
          status: 'PENDING',
          fileName,
          fileDataUrl: dataUrl || '',
          rejectReason: ''
        });
        saveState();
        showToast('Đã gửi Báo cáo cá nhân về Chi ủy Chi bộ thành công!');
      };

      if (fileInput && fileInput.files && fileInput.files[0]) {
        const reader = new FileReader();
        reader.onload = (ev) => pushReport(ev.target.result);
        reader.readAsDataURL(fileInput.files[0]);
      } else {
        pushReport('');
      }
    }

    function reviewMemberReport(repId, decision) {
      const admin = state.members.find(m => m.id === currentUserId);
      if (!admin || admin.role !== 'ADMIN') return;

      const rep = state.incomingReports.find(r => r.id === repId);
      if (!rep) return;

      if (decision === 'REJECTED') {
        const reason = prompt('Nhập lý do từ chối (để Đảng viên sửa hoàn chỉnh gửi lại):', 'Nội dung chưa đầy đủ theo mẫu, đề nghị bổ sung thêm phần kiểm điểm khuyết điểm.');
        if (reason === null) return;
        rep.rejectReason = reason.trim();
        rep.status = 'REJECTED';
      } else {
        rep.status = 'APPROVED';
        rep.rejectReason = '';
      }
      saveState();
      showToast(decision === 'APPROVED' ? 'Đã duyệt báo cáo thành công!' : 'Đã từ chối và ghi chú lý do trả về cho Đảng viên!');
    }

    function publishWallPost(e) {
      e.preventDefault();
      const admin = state.members.find(m => m.id === currentUserId);
      if (!admin || admin.role !== 'ADMIN') return;

      const category = document.getElementById('wall-cat').value;
      const title = document.getElementById('wall-title').value.trim();
      const summary = document.getElementById('wall-summary').value.trim();
      const content = document.getElementById('wall-content').value.trim();
      const imgInput = document.getElementById('wall-img-input');
      const fileInput = document.getElementById('wall-file-input');

      if (!title || !content) return alert('Vui lòng nhập tiêu đề và nội dung bài đăng!');

      const exactTimeStr = getCurrentTimestampStr();

      const finalizePost = (imageUrl, attachmentName, attachmentDataUrl) => {
        if (state.editingWallPostId) {
          const idx = state.wallPosts.findIndex(p => p.id === state.editingWallPostId);
          if (idx !== -1) {
            state.wallPosts[idx] = {
              ...state.wallPosts[idx],
              category,
              title,
              author: `${admin.fullName} (${admin.position})`,
              postedAt: `${exactTimeStr} (Đã chỉnh sửa)`,
              summary: summary || content.slice(0, 160) + '...',
              content,
              imageUrl: imageUrl || state.wallPosts[idx].imageUrl,
              attachmentName: attachmentName || state.wallPosts[idx].attachmentName,
              attachmentDataUrl: attachmentDataUrl || state.wallPosts[idx].attachmentDataUrl
            };
          }
          state.editingWallPostId = '';
        } else {
          state.wallPosts.unshift({
            id: 'WALL-' + Date.now(),
            category,
            title,
            author: `${admin.fullName} (${admin.position})`,
            postedAt: exactTimeStr,
            summary: summary || content.slice(0, 160) + '...',
            content,
            imageUrl: imageUrl || '',
            attachmentName: attachmentName || '',
            attachmentDataUrl: attachmentDataUrl || '',
            savedBy: [admin.id]
          });
        }

        state.wallPublishResultBanner = `Đăng bài thành công vào ngày ${exactTimeStr} bởi đồng chí ${admin.fullName}.`;
        saveState();
        showToast(`Hoàn thành đăng bài lúc ${exactTimeStr}!`);
      };

      const readAttachment = (imgUrl) => {
        if (fileInput && fileInput.files && fileInput.files[0]) {
          const f = fileInput.files[0];
          const r2 = new FileReader();
          r2.onload = (ev2) => finalizePost(imgUrl, f.name, ev2.target.result);
          r2.readAsDataURL(f);
        } else {
          finalizePost(imgUrl, '', '');
        }
      };

      if (imgInput && imgInput.files && imgInput.files[0]) {
        const r1 = new FileReader();
        r1.onload = (ev1) => readAttachment(ev1.target.result);
        r1.readAsDataURL(imgInput.files[0]);
      } else {
        readAttachment('');
      }
    }

      render();
    }

      const user = state.members.find(m => m.id === currentUserId);
      const newPass = prompt('Nhập mật khẩu mới cho đồng chí ' + user.fullName + ' (tối thiểu 4 ký tự):');

      const content = document.getElementById('inv-content').value.trim();

    function submitAbsenceFromNotice(meetingId) {
      const user = state.members.find(m => m.id === currentUserId);

      if (reason.length < 5) return alert('Vui lòng ghi rõ lý do xin vắng mặt trước khi nhấn Gửi đi!');
      const meeting = state.meetings.find(m => m.id === meetingId);

    function sendStudyDocument(e) {
      e.preventDefault();
      const admin = state.members.find(m => m.id === currentUserId);
      const meetingId = document.getElementById('doc-meeting-id').value;
      const title = document.getElementById('doc-title').value.trim();
      const docType = document.getElementById('doc-type').value;
      const summary = document.getElementById('doc-summary').value.trim();
      const contentFull = document.getElementById('doc-content-full').value.trim();
      const fileInput = document.getElementById('doc-file-input');
      if (!title) return alert('Vui lòng nhập tiêu đề tài liệu!');
      const meeting = state.meetings.find(m => m.id === meetingId);
      const releaseHint = meeting ? `${calc3DaysBefore(meeting.date)} (Trước ngày họp ${meeting.date} đúng 03 ngày)` : 'Trước ngày họp 03 ngày';

      const finalizeDoc = (fileName, fileDataUrl) => {
        state.documents.unshift({
          id: 'DOC-' + Date.now(),
          meetingId,
          meetingTitle: meeting ? meeting.title : meetingId,
          title,
          docType,
          releaseDate: releaseHint,
          uploadedBy: `${admin.fullName} (${admin.position})`,
          summary: summary || 'Tài liệu nghiên cứu phục vụ kỳ sinh hoạt Chi bộ 26.',
          contentFull: contentFull || summary || 'Vui lòng tải tệp đính kèm bên dưới để nghiên cứu chi tiết.',
          fileName: fileName || '',
          fileDataUrl: fileDataUrl || '',
          readBy: [admin.id]
        });
        saveState();
        showToast('Đã phát hành tài liệu nghiên cứu (trước 3 ngày họp) tới 44 Đảng viên!');
      };

      if (fileInput && fileInput.files && fileInput.files[0]) {
        const file = fileInput.files[0];
        const reader = new FileReader();
        reader.onload = (ev) => finalizeDoc(file.name, ev.target.result);
        reader.readAsDataURL(file);
      } else {
        finalizeDoc('', '');
      }
    }

    function reviewLeaveRequest(reqId, decision) {
      const admin = state.members.find(m => m.id === currentUserId);
      const req = state.leaveRequests.find(r => r.id === reqId);
      if (!req) return;
      req.status = decision;
      req.reviewedBy = admin.fullName;
      if (!state.attendance[req.memberId]) state.attendance[req.memberId] = {};
      state.attendance[req.memberId][req.meetingId] = decision === 'APPROVED' ? 'EXCUSED' : 'UNEXCUSED';

      showToast(decision === 'APPROVED' ? 'Đã DUYỆT vắng có phép cho đồng chí ' + req.memberName : 'Đã TỪ CHỐI đơn xin vắng');

      if (!m) return;
      const order = ['Chưa làm sạch', 'Đang làm sạch', 'Đã làm sạch'];

      showToast(`Đã chuyển trạng thái dữ liệu Đ/c ${m.fullName} sang: ${m.cleanStatus}`);

    function render() {
      const app = document.getElementById('app');
      const user = state.members.find(m => m.id === currentUserId);
      if (!user) {
        app.innerHTML = renderLogin();
        return;
      }

      const isAdmin = user.role === 'ADMIN';
      const activeMeeting = state.meetings.find(m => m.id === state.selectedMeetingId) || state.meetings[0];

      const totalMembers = state.members.length;
      const officialCount = state.members.filter(m => m.status === 'Chính thức').length;
      const reserveCount = state.members.filter(m => m.status === 'Dự bị').length;

      let presentCount = 0, excusedCount = 0, unexcusedCount = 0, pendingCount = 0;
      state.members.forEach(m => {
        const st = (state.attendance[m.id] && state.attendance[m.id][activeMeeting.id]) || 'PENDING';
        if (st === 'PRESENT') presentCount++;
        else if (st === 'EXCUSED') excusedCount++;
        else if (st === 'UNEXCUSED') unexcusedCount++;
        else pendingCount++;
      });

      const paidMembers = state.members.filter(m => getMemberFeeRecord(m.id, REAL_PERIOD_KEY).paid);
      const totalFeeCollected = paidMembers.reduce((s, m) => s + getMemberFeeRecord(m.id, REAL_PERIOD_KEY).amount, 0);
      const pendingLeaves = state.leaveRequests.filter(r => r.status === 'PENDING');

      const cleanDone = state.members.filter(m => m.cleanStatus === 'Đã làm sạch').length;
      const cleanDoing = state.members.filter(m => m.cleanStatus === 'Đang làm sạch').length;
      const cleanNot = state.members.filter(m => m.cleanStatus === 'Chưa làm sạch').length;

      const tabs = [
        { id: 'dashboard', label: '🏠 Tổng quan' },
        { id: 'wall', label: `📰 Bản tin Chi bộ (${state.wallPosts.length})` },
        { id: 'ai_reports', label: '📄 Lập báo cáo và Biểu mẫu' },
        { id: 'documents', label: `📚 Tài liệu trước 3 ngày (${state.documents.length})` },
        { id: 'attendance', label: '📋 Điểm danh & Báo vắng' + (isAdmin && pendingLeaves.length ? ` (${pendingLeaves.length})` : '') },
        { id: 'fees', label: `💳 Sổ Đảng phí Tháng ${REAL_MONTH_STR}` },
        { id: 'evaluation', label: '📊 Đánh giá chất lượng sinh hoạt' }
      ];

      app.innerHTML = `
        ${toastMessage ? `<div class="fixed bottom-4 right-4 z-50 bg-emerald-700 text-white px-4 py-3 rounded-xl shadow-xl text-sm font-medium border border-emerald-400 no-print">✓ ${toastMessage}</div>` : ''}

        <header class="bg-red-800 text-white shadow-md border-b-4 border-amber-400 no-print">
          <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">

              <div>

                <div class="font-bold text-base sm:text-lg leading-tight">CHI BỘ 26 — HỆ THỐNG QUẢN LÝ CÔNG TÁC ĐẢNG</div>
              </div>
            </div>
            <div class="flex items-center gap-2 sm:gap-3">
              <div class="text-right">
                <div class="text-sm font-semibold">${user.fullName}</div>
                <div class="text-xs text-amber-200">${isAdmin ? '🛡️ ADMIN: ' + user.position : '👤 ' + user.partyGroup + ' (' + user.status + ')'}</div>
              </div>
              <button onclick="changePassword()" class="bg-red-900 hover:bg-red-950 px-2.5 py-1.5 rounded-lg text-xs border border-red-600">🔑 Đổi MK</button>
              <button onclick="handleLogout()" class="bg-amber-400 hover:bg-amber-300 text-red-950 font-semibold px-3 py-1.5 rounded-lg text-xs">Đăng xuất</button>

            <div class="max-w-7xl mx-auto px-4 flex overflow-x-auto gap-1 py-1.5">
              ${tabs.map(t => `
                <button onclick="setTab('${t.id}')" class="px-3 py-2 rounded-lg text-xs font-semibold whitespace-nowrap transition ${state.activeTab === t.id ? 'bg-amber-400 text-red-950 shadow' : 'text-red-100 hover:bg-red-800'}">
                  ${t.label}

        </main>
      `;

    function renderDashboard(user, isAdmin, activeMeeting, stats) {
      const latestInv = state.invitations[0];
      const targetMeetingId = latestInv ? latestInv.meetingId : activeMeeting.id;
      const myAtt = (state.attendance[user.id] && state.attendance[user.id][targetMeetingId]) || 'PENDING';
      const myFeeRec = getMemberFeeRecord(user.id, REAL_PERIOD_KEY);
      const isAbsenceBtnDisabled = (state.absenceInputReason || '').trim().length < 5;

      return `
        <div class="space-y-6">
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">

                  <div>
                    <span class="font-bold text-slate-900">${r.memberName}</span> (${r.memberId}) — <em>${r.meetingTitle}</em>
                    <div class="text-slate-700 mt-0.5"><strong>Lý do:</strong> ${r.reason}</div>
                  </div>
                  <div class="flex items-center gap-2">
                    <span class="px-2 py-0.5 rounded font-bold ${r.status === 'APPROVED' ? 'bg-emerald-100 text-emerald-800' : (r.status === 'REJECTED' ? 'bg-red-100 text-red-800' : 'bg-amber-100 text-amber-800')}">
                      ${r.status === 'APPROVED' ? 'Đã duyệt phép' : (r.status === 'REJECTED' ? 'Không duyệt' : 'Chờ duyệt')}
                    </span>
                    ${isAdmin && r.status === 'PENDING' ? `
                      <button onclick="reviewLeaveRequest('${r.id}', 'APPROVED')" class="bg-emerald-600 text-white px-2.5 py-1 rounded font-semibold">Duyệt</button>
                      <button onclick="reviewLeaveRequest('${r.id}', 'REJECTED')" class="bg-red-600 text-white px-2.5 py-1 rounded font-semibold">Từ chối</button>
                    ` : ''}
                  </div>
                </div>
              `).join('')}
            </div>
          </div>

          <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="p-4 border-b border-slate-200 flex flex-wrap justify-between items-center gap-2">
              <h3 class="font-bold text-slate-900">Bảng điểm danh 44 Đảng viên (${activeMeeting.title})</h3>
              <select onchange="state.selectedMeetingId=this.value; render();" class="border border-slate-300 rounded-lg px-3 py-1.5 text-xs font-semibold">
                ${state.meetings.map(m => `<option value="${m.id}" ${m.id === activeMeeting.id ? 'selected' : ''}>${m.date} - ${m.title}</option>`).join('')}
              </select>
            </div>
            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse text-xs">
                <thead>
                  <tr class="bg-slate-100 text-slate-700 border-b border-slate-200">
                    <th class="p-3">STT</th>
                    <th class="p-3">Họ và tên</th>
                    <th class="p-3">Tổ Đảng</th>
                    <th class="p-3">Trạng thái</th>
                    ${isAdmin ? '<th class="p-3 text-right">Admin duyệt</th>' : ''}
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  ${state.members.map(m => {
                    const st = (state.attendance[m.id] && state.attendance[m.id][activeMeeting.id]) || 'PENDING';
                    const badge = st === 'PRESENT' ? '<span class="px-2 py-0.5 rounded bg-emerald-100 text-emerald-800 font-bold">Có mặt</span>'
                      : st === 'EXCUSED' ? '<span class="px-2 py-0.5 rounded bg-blue-100 text-blue-800 font-bold">Vắng có phép</span>'
                      : st === 'UNEXCUSED' ? '<span class="px-2 py-0.5 rounded bg-red-100 text-red-800 font-bold">Vắng không phép</span>'
                      : '<span class="px-2 py-0.5 rounded bg-slate-100 text-slate-600">Chưa điểm danh</span>';
                    return `
                      <tr>
                        <td class="p-3">${m.stt}</td>
                        <td class="p-3 font-bold">${m.fullName}</td>
                        <td class="p-3">${m.partyGroup}</td>
                        <td class="p-3">${badge}</td>
                        ${isAdmin ? `
                          <td class="p-3 text-right space-x-1">
                            <button onclick="setAttendance('${m.id}', '${activeMeeting.id}', 'PRESENT')" class="px-2 py-1 rounded bg-emerald-600 text-white">Có mặt</button>
                            <button onclick="setAttendance('${m.id}', 'EXCUSED')" class="px-2 py-1 rounded bg-blue-600 text-white">Có phép</button>
                          </td>
                        ` : ''}
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    function renderEvaluation(isAdmin, cleanDone, cleanDoing, cleanNot) {
      const activeM = state.meetings.find(m => m.id === state.selectedMeetingId) || state.meetings[0];
      let pCount = 0, eCount = 0, uCount = 0;
      state.members.forEach(m => {
        const st = (state.attendance[m.id] && state.attendance[m.id][activeM.id]) || 'PENDING';
        if (st === 'PRESENT') pCount++;
        else if (st === 'EXCUSED') eCount++;
        else if (st === 'UNEXCUSED') uCount++;
      });
      const total = state.members.length;
      const rateP = ((pCount / total) * 100).toFixed(1);

      return `
        <div class="space-y-6">
          <div class="bg-gradient-to-r from-red-900 to-red-800 text-white rounded-2xl p-5 shadow">
            <div class="text-xs uppercase tracking-wider text-amber-300 font-bold">Hệ thống theo dõi & đánh giá</div>
            <h2 class="text-lg sm:text-xl font-bold mt-1">📊 Đánh giá chất lượng sinh hoạt Chi bộ 26</h2>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div onclick="alert('Chi tiết Sinh hoạt định kỳ: Có mặt ${pCount}/44 (${rateP}%), Vắng có phép: ${eCount}, Vắng không phép: ${uCount}')" class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 cursor-pointer hover:border-red-500 transition">
              <div class="text-xs font-bold text-slate-500 uppercase">Khung 1: Sinh hoạt định kỳ</div>
              <div class="text-xl font-bold text-red-700 mt-2">Tỷ lệ: ${rateP}%</div>
              <div class="text-xs text-slate-600 mt-1">Có mặt: ${pCount} • Vắng: ${eCount + uCount} (Bấm xem chi tiết)</div>
            </div>
            <div onclick="alert('Chi tiết Sinh hoạt chuyên đề: Tỷ lệ tham gia đạt 95.5% (42/44 đồng chí có mặt)')" class="bg-white p-5 rounded-2xl santa bg-white p-5 rounded-2xl shadow-sm border border-slate-200 cursor-pointer hover:border-red-500 transition">
              <div class="text-xs font-bold text-slate-500 uppercase">Khung 2: Sinh hoạt chuyên đề</div>
              <div class="text-xl font-bold text-blue-700 mt-2">Tỷ lệ: 95.5%</div>
              <div class="text-xs text-slate-600 mt-1">Đã hoàn thành chỉ tiêu (Bấm xem chi tiết)</div>
            </div>
            <div onclick="alert('Chi tiết Học tập Nghị quyết: 100% Đảng viên hoàn thành nghiên cứu và kiểm tra trực tuyến')" class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 cursor-pointer hover:border-red-500 transition">
              <div class="text-xs font-bold text-slate-500 uppercase">Khung 3: Học tập Nghị quyết</div>
              <div class="text-xl font-bold text-emerald-700 mt-2">Tỷ lệ: 100%</div>
              <div class="text-xs text-slate-600 mt-1">Đạt yêu cầu đợt sinh hoạt (Bấm xem chi tiết)</div>
            </div>
            <div onclick="alert('Khung 4: Tiến độ chuẩn hóa dữ liệu Đảng viên trên Sổ tay điện tử')" class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 cursor-pointer hover:border-red-500 transition">
              <div class="text-xs font-bold text-slate-500 uppercase">Khung 4: Nội dung liên quan khác</div>
              <div class="text-sm font-bold text-slate-900 mt-2">Chuẩn hóa dữ liệu Đảng viên</div>
              <div class="text-xs text-slate-600 mt-1">${cleanDone} Đã sạch • ${cleanDoing} Đang làm • ${cleanNot} Chưa làm</div>
            </div>
          </div>

          <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 space-y-4">
            <h3 class="font-bold text-slate-900 text-sm uppercase">📋 Tổng hợp Tiến độ Chuẩn hóa dữ liệu & Chỉ đạo từ Chi ủy</h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs font-semibold">
              <div class="p-3 rounded-xl bg-emerald-50 border border-emerald-300 text-emerald-900">✓ 26 Đã sạch (${((26/44)*100).toFixed(1)}%)</div>
              <div class="p-3 rounded-xl bg-amber-50 border border-amber-300 text-amber-900">⏳ 13 Đang làm (${((13/44)*100).toFixed(1)}%)</div>
              <div class="p-3 rounded-xl bg-red-50 border border-red-300 text-red-900">! 5 Chưa làm (${((5/44)*100).toFixed(1)}%)</div>
            </div>
            <div class="flex items-center gap-2 pt-2">
              <button type="button" onclick="window.print()" class="bg-blue-700 hover:bg-blue-800 text-white font-bold px-4 py-2 rounded-lg text-xs shadow">🖨 Đọc danh sách (Xuất bản PDF)</button>
              ${isAdmin ? '<span class="text-xs text-slate-500 italic">Admin có quyền tải lên nội dung chỉ đạo mới bên dưới.</span>' : ''}
            </div>
            ${isAdmin ? `
              <div class="mt-4 pt-4 border-t border-slate-200 space-y-2">
                <label class="block text-xs font-bold text-slate-700 uppercase">Ý kiến chỉ đạo / Cập nhật nhiệm vụ mới (Tối đa 550 ký tự):</label>
                <textarea rows="3" maxlength="550" placeholder="Nhập chỉ đạo mới triển khai cho các Tổ Đảng..." class="w-full border border-slate-300 rounded-lg p-3 text-xs focus:ring-2 focus:ring-red-600 focus:outline-none"></textarea>
                <div class="flex justify-between items-center">
                  <input type="file" class="text-xs border border-slate-300 rounded-lg p-1 bg-slate-50" />
                  <button type="button" onclick="showToast('Đã lưu và cập nhật chỉ đạo mới tới toàn thể Chi bộ!')" class="bg-red-700 hover:bg-red-800 text-white font-bold px-4 py-2 rounded-lg text-xs shadow">📤 Cập nhật nhiệm vụ</button>
                </div>
              </div>
            ` : ''}
          </div>
        </div>
      `;
    }

    render();
  </script>
</body>
</html>
