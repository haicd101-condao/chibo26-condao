    function saveState() {
      const now = new Date();
      state.lastSyncTime = now.toLocaleDateString('vi-VN') + ' ' + now.toTimeString().slice(0, 5);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      render();

    function showToast(msg) {
      toastMessage = msg;
      render();

        render();
      }, 4200);

    function formatVND(num) {
      return Number(num || 0).toLocaleString('vi-VN') + ' đ';
    }

    function calc3DaysBefore(dateVN) {
      try {
        const [d, m, y] = dateVN.split('/').map(Number);
        const dt = new Date(y, m - 1, d);
        dt.setDate(dt.getDate() - 3);
        return dt.toLocaleDateString('vi-VN');
      } catch (e) {
        return 'Trước 03 ngày';
      }
    }

    function getCurrentTimestampStr() {
      const n = new Date();
      const dd = String(n.getDate()).padStart(2, '0');
      const mm = String(n.getMonth() + 1).padStart(2, '0');
      const yyyy = n.getFullYear();
      const hh = String(n.getHours()).padStart(2, '0');
      const min = String(n.getMinutes()).padStart(2, '0');
      const ss = String(n.getSeconds()).padStart(2, '0');
      return `${dd}/${mm}/${yyyy} lúc ${hh}:${min}:${ss}`;
    }

    function getMemberFeeRecord(memberId, periodKey = REAL_PERIOD_KEY) {
      const m = state.members.find(x => x.id === memberId);
      if (!state.fees[memberId]) state.fees[memberId] = {};
      if (!state.fees[memberId][periodKey]) {
        state.fees[memberId][periodKey] = {
          paid: false,
          paidDate: '',
          amount: m ? m.monthlyFee : 80000,
          method: '',
          paidBy: '',
          portalRef: ''
        };
      }
      return state.fees[memberId][periodKey];
    }

    function submitSelfPartyFee(targetMemberId, isProxy = false) {
      const payer = state.members.find(m => m.id === currentUserId);
      const target = state.members.find(m => m.id === targetMemberId);
      if (!target) return;

      const defaultAmt = target.monthlyFee || 80000;
      const inputAmt = prompt(
        `Xác nhận báo nộp Đảng phí tháng ${REAL_PERIOD_KEY} cho Đ/c ${target.fullName}:\nNhập số tiền thực nộp (VNĐ):`,
        String(defaultAmt)
      );
      if (inputAmt === null) return;
      const cleanAmt = parseInt(inputAmt.replace(/[^0-9]/g, ''), 10) || defaultAmt;

      const todayStr = `${String(REAL_DAY).padStart(2, '0')}/${REAL_MONTH_STR}/${REAL_YEAR}`;
      const rec = getMemberFeeRecord(targetMemberId, REAL_PERIOD_KEY);
      rec.paid = true;
      rec.paidDate = todayStr;
      rec.amount = cleanAmt;
      rec.method = isProxy ? 'Đóng hộ qua Cổng TTHC Đảng' : 'Đảng viên báo nộp qua Cổng TTHC Đảng';
      rec.paidBy = payer.fullName;
      rec.portalRef = 'DVC-CD26-' + Math.floor(100000 + Math.random() * 900000);

      target.monthlyFee = cleanAmt;
      target.handbookSynced = true;
      saveState();
      showToast(`Đã xác nhận Đ/c ${target.fullName} nộp ${formatVND(cleanAmt)} Đảng phí tháng ${REAL_PERIOD_KEY}!`);
    }

    function toggleFeeStatusAdmin(targetMemberId) {
      const target = state.members.find(m => m.id === targetMemberId);
      const rec = getMemberFeeRecord(targetMemberId, REAL_PERIOD_KEY);
      if (rec.paid) {
        if (!confirm(`Chuyển trạng thái của Đ/c ${target.fullName} về Chưa nộp?`)) return;
        rec.paid = false;
        rec.paidDate = '';
        rec.portalRef = '';
        saveState();
        showToast(`Đã chuyển trạng thái của Đ/c ${target.fullName} về Chưa nộp`);
      } else {
        submitSelfPartyFee(targetMemberId, target.id !== currentUserId);
      }
    }

    function sendQuickFeeMessage(paid, unpaid, totalAmount) {
      const dateStr = `${String(REAL_DAY).padStart(2,'0')}/${REAL_MONTH_STR}/${REAL_YEAR}`;
      const msg = `Thông báo chung: Đến thời điểm hiện nay (${dateStr}), Chi bộ 26 đã hoàn thành đóng Đảng phí: ${paid} Đ/c, còn lại ${unpaid} Đ/c chưa hoàn thành (Tổng thu: ${totalAmount}). Chi ủy đề nghị các Đồng chí chưa đóng Đảng phí khẩn trương thực hiện hoàn thành trước ngày 25 để cùng Chi bộ hoàn thành nhiệm vụ theo quy định. Xin cảm ơn. (Danh sách thống kê chi tiết đính kèm bản PDF).`;
      prompt("Sao chép nhanh nội dung tin nhắn đôn đốc gửi Zalo/Group Chi bộ:", msg);

    function handleAiFileUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      state.aiUploadedFileName = file.name;
      if (file.type.startsWith('image/')) {
        const reader = new FileReader();
        reader.onload = function(ev) {
          state.aiUploadedImagePreview = ev.target.result;
          if (!state.aiRawNotes.trim()) {
            state.aiRawNotes = `[Đã tải lên ảnh chụp biên bản/tài liệu gốc: ${file.name}]\n- Nội dung trích xuất gợi ý: Cuộc họp Chi bộ 26 thống nhất đánh giá kết quả thực hiện nhiệm vụ tháng qua, biểu quyết thông qua các chỉ tiêu trọng tâm tháng tới với 100% Đảng viên có mặt tán thành.`;
          }
          render();
          showToast('Đã tiếp nhận ảnh chụp biên bản gốc!');
        };
        reader.readAsDataURL(file);
      } else {
        const reader = new FileReader();
        reader.onload = function(ev) {
          const text = ev.target.result;
          if (text && typeof text === 'string' && !text.includes('\u0000')) {
            state.aiRawNotes = text.slice(0, 6000);
          } else {
            state.aiRawNotes = `[Đã tiếp nhận tệp Word/tài liệu gốc: ${file.name}]\n- Dữ liệu gốc đã sẵn sàng để biên soạn chuẩn thể thức văn bản Đảng.`;
          }
          state.aiUploadedImagePreview = '';
          render();
          showToast('Đã tải tệp tài liệu gốc lên hệ thống!');
        };
        reader.readAsText(file);
      }
    }

    function buildTemplateText(tpl, mm, yyyy, raw) {

    function runAiDocumentSynthesis() {
      const user = state.members.find(m => m.id === currentUserId);
      if (!user || user.role !== 'ADMIN') {
        return alert('Chỉ tài khoản Admin (Chi ủy) mới có quyền soạn báo cáo!');
      }
      const tpl = document.getElementById('tpl-selector').value;
      const mm = document.getElementById('rpt-month').value;
      const yyyy = document.getElementById('rpt-year').value;
      const raw = document.getElementById('ai-raw-input').value.trim();

      state.selectedDocTemplate = tpl;
      state.reportTargetMonth = mm;
      state.reportTargetYear = yyyy;
      state.aiRawNotes = raw;
      state.printMode = 'AI_DOC';
      state.aiGeneratedOutput = buildTemplateText(tpl, mm, yyyy, raw);
      saveState();
      showToast('Đã lập báo cáo chuẩn thể thức văn bản Đảng!');
    }

    function downloadTemplateForm(tplKey) {
      const mm = state.reportTargetMonth || REAL_MONTH_STR;
      const yyyy = state.reportTargetYear || String(REAL_YEAR);
      const content = buildTemplateText(tplKey, mm, yyyy, '');
      const htmlDoc = `
        <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
        <head>
          <meta charset='utf-8'>
          <title>BieuMau_ChiBo26</title>
          <style>
            @page { size: A4; margin: 3cm 2cm 2cm 3cm; }
            body { font-family: 'Times New Roman', Times, serif; font-size: 14pt; line-height: 1.5; text-align: justify; margin: 0; }
            pre { font-family: 'Times New Roman', Times, serif; white-space: pre-wrap; word-wrap: break-word; margin: 0; font-size: 14pt; line-height: 1.5; text-align: justify; }
          </style>
        </head>
        <body>
          <pre>${content}</pre>
        </body>
        </html>
      `;
      const blob = new Blob(['\ufeff', htmlDoc], { type: 'application/msword' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `BieuMau_ChiBo26_${tplKey}_Thang${mm}_${yyyy}.doc`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('Đã tải biểu mẫu chuẩn theo thể thức văn bản Đảng!');
    }

            @page { size: A4; margin: 3cm 2cm 2cm 3cm; }
            body { font-family: 'Times New Roman', Times, serif; font-size: 14pt; line-height: 1.5; text-align: justify; margin: 0; }
            pre { font-family: 'Times New Roman', Times, serif; white-space: pre-wrap; word-wrap: break-word; margin: 0; font-size: 14pt; line-height: 1.5; text-align: justify; }
          </style>
        </head>
        <body>
          <pre>${content}</pre>
        </body>
        </html>
      `;
      const blob = new Blob(['\ufeff', htmlDoc], { type: 'application/msword' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `ChiBo26_${state.selectedDocTemplate}_Thang${state.reportTargetMonth}_${state.reportTargetYear}.doc`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('Đã tải tệp Word (.doc) theo chuẩn thể thức văn bản Đảng!');
    }

    function submitMemberReport() {
      const titleInput = document.getElementById('member-report-title');
      const fileInput = document.getElementById('member-report-file');
      const user = state.members.find(m => m.id === currentUserId);
      if (!user) return;

      const title = titleInput ? titleInput.value.trim() : `Báo cáo kiểm điểm cá nhân năm ${REAL_YEAR}`;
      const fileName = fileInput && fileInput.files[0] ? fileInput.files[0].name : 'BaoCao_KiemDiem_CaNhan.doc';

      const pushReport = (dataUrl) => {
        state.incomingReports.unshift({
          id: 'REP-' + Date.now(),
          memberId: user.id,
          memberName: user.fullName,
          title,
          submittedAt: new Date().toLocaleDateString('vi-VN') + ' ' + new Date().toTimeString().slice(0, 5),
          status: 'PENDING',
          fileName,
          fileDataUrl: dataUrl || '',
          rejectReason: ''
        });
        saveState();
        showToast('Đã gửi Báo cáo cá nhân về Chi ủy Chi bộ thành công!');
      };

      if (fileInput && fileInput.files && fileInput.files[0]) {
        const reader = new FileReader();
        reader.onload = (ev) => pushReport(ev.target.result);
        reader.readAsDataURL(fileInput.files[0]);
      } else {
        pushReport('');
      }
    }

    function reviewMemberReport(repId, decision) {
      const admin = state.members.find(m => m.id === currentUserId);
      if (!admin || admin.role !== 'ADMIN') return;

      const rep = state.incomingReports.find(r => r.id === repId);
      if (!rep) return;

      if (decision === 'REJECTED') {
        const reason = prompt('Nhập lý do từ chối (để Đảng viên sửa hoàn chỉnh gửi lại):', 'Nội dung chưa đầy đủ theo mẫu, đề nghị bổ sung thêm phần kiểm điểm khuyết điểm.');
        if (reason === null) return;
        rep.rejectReason = reason.trim();
        rep.status = 'REJECTED';
      } else {
        rep.status = 'APPROVED';
        rep.rejectReason = '';
      }
      saveState();
      showToast(decision === 'APPROVED' ? 'Đã duyệt báo cáo thành công!' : 'Đã từ chối và ghi chú lý do trả về cho Đảng viên!');
    }

    function publishWallPost(e) {
      e.preventDefault();
      const admin = state.members.find(m => m.id === currentUserId);
      if (!admin || admin.role !== 'ADMIN') return;

      const category = document.getElementById('wall-cat').value;
      const title = document.getElementById('wall-title').value.trim();
      const summary = document.getElementById('wall-summary').value.trim();
      const content = document.getElementById('wall-content').value.trim();
      const imgInput = document.getElementById('wall-img-input');
      const fileInput = document.getElementById('wall-file-input');

      if (!title || !content) return alert('Vui lòng nhập tiêu đề và nội dung bài đăng!');

      const exactTimeStr = getCurrentTimestampStr();

      const finalizePost = (imageUrl, attachmentName, attachmentDataUrl) => {
        if (state.editingWallPostId) {
          const idx = state.wallPosts.findIndex(p => p.id === state.editingWallPostId);
          if (idx !== -1) {
            state.wallPosts[idx] = {
              ...state.wallPosts[idx],
              category,
              title,
              author: `${admin.fullName} (${admin.position})`,
              postedAt: `${exactTimeStr} (Đã chỉnh sửa)`,
              summary: summary || content.slice(0, 160) + '...',
              content,
              imageUrl: imageUrl || state.wallPosts[idx].imageUrl,
              attachmentName: attachmentName || state.wallPosts[idx].attachmentName,
              attachmentDataUrl: attachmentDataUrl || state.wallPosts[idx].attachmentDataUrl
            };
          }
          state.editingWallPostId = '';
        } else {
          state.wallPosts.unshift({
            id: 'WALL-' + Date.now(),
            category,
            title,
            author: `${admin.fullName} (${admin.position})`,
            postedAt: exactTimeStr,
            summary: summary || content.slice(0, 160) + '...',
            content,
            imageUrl: imageUrl || '',
            attachmentName: attachmentName || '',
            attachmentDataUrl: attachmentDataUrl || '',
            savedBy: [admin.id]
          });
        }

        state.wallPublishResultBanner = `Đăng bài thành công vào ngày ${exactTimeStr} bởi đồng chí ${admin.fullName}.`;
        saveState();
        showToast(`Hoàn thành đăng bài lúc ${exactTimeStr}!`);
      };

      const readAttachment = (imgUrl) => {
        if (fileInput && fileInput.files && fileInput.files[0]) {
          const f = fileInput.files[0];
          const r2 = new FileReader();
          r2.onload = (ev2) => finalizePost(imgUrl, f.name, ev2.target.result);
          r2.readAsDataURL(f);
        } else {
          finalizePost(imgUrl, '', '');
        }
      };

      if (imgInput && imgInput.files && imgInput.files[0]) {
        const r1 = new FileReader();
        r1.onload = (ev1) => readAttachment(ev1.target.result);
        r1.readAsDataURL(imgInput.files[0]);
      } else {
        readAttachment('');
      }
    }

    function refreshRecallWallForm() {
      if (state.editingWallPostId) {
        state.editingWallPostId = '';
        state.wallPublishResultBanner = '';
        render();
        showToast('Đã làm mới khung soạn thảo Bản tin!');
        return;
      }
      const latestPost = state.wallPosts[0];
      if (!latestPost) {
        render();
        return;
      }
      if (confirm(`Thu hồi bài đăng gần nhất "${latestPost.title}" vào khung soạn thảo để chỉnh sửa lại?`)) {
        state.editingWallPostId = latestPost.id;
        render();
        setTimeout(() => {
          const catEl = document.getElementById('wall-cat');
          const titleEl = document.getElementById('wall-title');
          const sumEl = document.getElementById('wall-summary');
          const contEl = document.getElementById('wall-content');
          if (catEl) catEl.value = latestPost.category;
          if (titleEl) titleEl.value = latestPost.title;
          if (sumEl) sumEl.value = latestPost.summary;
          if (contEl) contEl.value = latestPost.content;
        }, 30);
        showToast('Đã thu hồi bài đăng vào khung soạn thảo để chỉnh sửa!');
      }
    }

    function recallSpecificWallPost(postId) {
      const post = state.wallPosts.find(p => p.id === postId);
      if (!post) return;
      state.editingWallPostId = post.id;
      render();
      setTimeout(() => {
        const catEl = document.getElementById('wall-cat');
        const titleEl = document.getElementById('wall-title');
        const sumEl = document.getElementById('wall-summary');
        const contEl = document.getElementById('wall-content');
        if (catEl) catEl.value = post.category;
        if (titleEl) titleEl.value = post.title;
        if (sumEl) sumEl.value = post.summary;
        if (contEl) contEl.value = post.content;
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }, 30);
      showToast('Đã thu hồi bài viết lên khung chỉnh sửa!');
    }

    function downloadWallPost(postId) {
      const post = state.wallPosts.find(p => p.id === postId);
      if (!post) return;
      if (!post.savedBy.includes(currentUserId)) {
        post.savedBy.push(currentUserId);
        saveState();
      }
      if (post.attachmentDataUrl) {
        const a = document.createElement('a');
        a.href = post.attachmentDataUrl;
        a.download = post.attachmentName || 'TaiLieu_ChiBo26';
        a.click();
      } else {
        const text = `ĐẢNG ỦY ĐẶC KHU CÔN ĐẢO - CHI BỘ 26\nCHUYÊN MỤC: ${post.category.toUpperCase()}\nTIÊU ĐỀ: ${post.title}\nNgười đăng: ${post.author} | Thời gian: ${post.postedAt}\n------------------------------------------------------------\n${post.content}`;
        const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = post.attachmentName || `${post.id}_LuuTru_ChiBo26.txt`;
        a.click();
        URL.revokeObjectURL(url);
      }
      showToast('Đã tải bài viết / tài liệu về máy để lưu xem lại!');
    }

    function deleteWallPost(postId) {
      if (!confirm('Xóa bài đăng này khỏi Bản tin Chi bộ?')) return;
      state.wallPosts = state.wallPosts.filter(p => p.id !== postId);
      if (state.editingWallPostId === postId) state.editingWallPostId = '';
      saveState();
      showToast('Đã xóa bài đăng!');
    }

    function handleLogin(e) {
      e.preventDefault();
      const id = document.getElementById('login-user').value;
      const pass = document.getElementById('login-pass').value;
      const user = state.members.find(m => m.id === id);
      if (!user) return alert('Vui lòng chọn tài khoản Đảng viên!');
      if (user.password !== pass) return alert('Mật khẩu không chính xác! (Mặc định: 123456)');
      currentUserId = user.id;
      localStorage.setItem(USER_SESSION_KEY, currentUserId);
      state.activeTab = 'dashboard';
      state.showAbsenceBox = false;
      state.absenceInputReason = '';
      showToast('Đăng nhập thành công: Đồng chí ' + user.fullName);
    }

    function handleLogout() {
      currentUserId = '';
      localStorage.removeItem(USER_SESSION_KEY);
      render();
    }

    function changePassword() {
      const user = state.members.find(m => m.id === currentUserId);
      const newPass = prompt('Nhập mật khẩu mới cho đồng chí ' + user.fullName + ' (tối thiểu 4 ký tự):');
      if (!newPass || newPass.trim().length < 4) return;
      user.password = newPass.trim();
      saveState();
      showToast('Đã cập nhật mật khẩu mới thành công!');
    }

    function setTab(tab) {
      state.activeTab = tab;
      render();
    }

    function sendMeetingInvitation(e) {
      e.preventDefault();
      const admin = state.members.find(m => m.id === currentUserId);
      const meetingId = document.getElementById('inv-meeting-id').value;
      const content = document.getElementById('inv-content').value.trim();
      if (!content) return alert('Vui lòng nhập nội dung thông báo mời họp!');
      const meeting = state.meetings.find(m => m.id === meetingId);
      const now = new Date();
      state.invitations.unshift({
        id: 'INV-' + Date.now(),
        meetingId,
        meetingTitle: meeting ? meeting.title : meetingId,
        senderName: `${admin.fullName} (${admin.position})`,
        sentAt: now.toLocaleDateString('vi-VN') + ' ' + now.toTimeString().slice(0, 5),
        content
      });
      state.selectedMeetingId = meetingId;
      saveState();
      showToast('Đã gửi thông báo mời tham dự sinh hoạt đến tài khoản của 44 Đảng viên!');
    }

    function toggleAbsenceBox() {
      state.showAbsenceBox = !state.showAbsenceBox;
      render();
    }

    function updateAbsenceReason(val) {
      state.absenceInputReason = val;
      const btn = document.getElementById('btn-submit-absence');
      if (btn) {
        const valid = val.trim().length >= 5;
        btn.disabled = !valid;
        btn.className = valid
          ? 'bg-red-700 hover:bg-red-800 text-white font-bold px-4 py-2 rounded-lg text-xs shadow cursor-pointer transition'
          : 'bg-slate-300 text-slate-500 font-bold px-4 py-2 rounded-lg text-xs cursor-not-allowed';
      }
    }

    function submitAbsenceFromNotice(meetingId) {
      const user = state.members.find(m => m.id === currentUserId);
      const reason = (state.absenceInputReason || '').trim();
      if (reason.length < 5) return alert('Vui lòng ghi rõ lý do xin vắng mặt trước khi nhấn Gửi đi!');
      const meeting = state.meetings.find(m => m.id === meetingId);
      state.leaveRequests.unshift({
        id: 'LR-' + Date.now(),
        memberId: user.id,
        memberName: user.fullName,
        meetingId,
        meetingTitle: meeting ? meeting.title : meetingId,
        reason,
        submittedAt: new Date().toLocaleDateString('vi-VN') + ' ' + new Date().toTimeString().slice(0, 5),
        status: 'PENDING',
        reviewedBy: ''
      });
      if (!state.attendance[user.id]) state.attendance[user.id] = {};
      state.attendance[user.id][meetingId] = 'LEAVE_PENDING';
      state.showAbsenceBox = false;
      state.absenceInputReason = '';
      saveState();
      showToast('Đã gửi đơn Báo vắng kèm lý do lên Chi ủy Chi bộ 26!');
    }

    function sendStudyDocument(e) {
      e.preventDefault();
      const admin = state.members.find(m => m.id === currentUserId);
      const meetingId = document.getElementById('doc-meeting-id').value;
      const title = document.getElementById('doc-title').value.trim();
      const docType = document.getElementById('doc-type').value;
      const summary = document.getElementById('doc-summary').value.trim();
      const contentFull = document.getElementById('doc-content-full').value.trim();
      const fileInput = document.getElementById('doc-file-input');
      if (!title) return alert('Vui lòng nhập tiêu đề tài liệu!');
      const meeting = state.meetings.find(m => m.id === meetingId);
      const releaseHint = meeting ? `${calc3DaysBefore(meeting.date)} (Trước ngày họp ${meeting.date} đúng 03 ngày)` : 'Trước ngày họp 03 ngày';

      const finalizeDoc = (fileName, fileDataUrl) => {
        state.documents.unshift({
          id: 'DOC-' + Date.now(),
          meetingId,
          meetingTitle: meeting ? meeting.title : meetingId,
          title,
          docType,
          releaseDate: releaseHint,
          uploadedBy: `${admin.fullName} (${admin.position})`,
          summary: summary || 'Tài liệu nghiên cứu phục vụ kỳ sinh hoạt Chi bộ 26.',
          contentFull: contentFull || summary || 'Vui lòng tải tệp đính kèm bên dưới để nghiên cứu chi tiết.',
          fileName: fileName || '',
          fileDataUrl: fileDataUrl || '',
          readBy: [admin.id]
        });
        saveState();
        showToast('Đã phát hành tài liệu nghiên cứu (trước 3 ngày họp) tới 44 Đảng viên!');
      };

      if (fileInput && fileInput.files && fileInput.files[0]) {
        const file = fileInput.files[0];
        const reader = new FileReader();
        reader.onload = (ev) => finalizeDoc(file.name, ev.target.result);
        reader.readAsDataURL(file);
      } else {
        finalizeDoc('', '');
      }
    }

    function markDocAsRead(docId) {
      const doc = state.documents.find(d => d.id === docId);
      if (!doc) return;
      if (!doc.readBy.includes(currentUserId)) doc.readBy.push(currentUserId);
      state.viewingDocId = state.viewingDocId === docId ? '' : docId;
      saveState();
    }

    function downloadDocFile(docId) {
      const doc = state.documents.find(d => d.id === docId);
      if (!doc) return;
      if (!doc.readBy.includes(currentUserId)) {
        doc.readBy.push(currentUserId);
        saveState();
      }
      if (doc.fileDataUrl) {
        const a = document.createElement('a');
        a.href = doc.fileDataUrl;
        a.download = doc.fileName || 'TaiLieu_ChiBo26';
        a.click();
      } else {
        const text = `${doc.title.toUpperCase()}\nĐơn vị: Chi bộ 26 - Đảng ủy Đặc khu Côn Đảo\n----------------------------------------\n${doc.contentFull}`;
        const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = doc.fileName || (doc.id + '_TaiLieuNghienCuu.txt');
        a.click();
        URL.revokeObjectURL(url);
      }
      showToast('Đã tải tài liệu nghiên cứu về máy!');
    }

    function setAttendance(memberId, meetingId, status) {
      if (!state.attendance[memberId]) state.attendance[memberId] = {};
      state.attendance[memberId][meetingId] = status;
      saveState();
      showToast('Đã cập nhật trạng thái điểm danh!');
    }

    function reviewLeaveRequest(reqId, decision) {
      const admin = state.members.find(m => m.id === currentUserId);
      const req = state.leaveRequests.find(r => r.id === reqId);
      if (!req) return;
      req.status = decision;
      req.reviewedBy = admin.fullName;
      if (!state.attendance[req.memberId]) state.attendance[req.memberId] = {};
      state.attendance[req.memberId][req.meetingId] = decision === 'APPROVED' ? 'EXCUSED' : 'UNEXCUSED';
      saveState();
      showToast(decision === 'APPROVED' ? 'Đã DUYỆT vắng có phép cho đồng chí ' + req.memberName : 'Đã TỪ CHỐI đơn xin vắng');
    }

    render();
  </script>
</body>
</html>
"""
